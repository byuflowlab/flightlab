[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightlab"
version = "0.9.0"
description = "FlightLab student analysis tools for BYU ME 415 Flight Vehicle Design"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ME 415, Brigham Young University" }]

# Verified against numpy 2.5.3, scipy 1.18.1, matplotlib 3.11.2,
# neuralfoil 0.3.3 (aerosandbox 4.2.10).
#
# NeuralFoil is capped below 0.4: the network weights are part of the answer, so
# a minor release can move every number in flightlab.foil.  tests/test_foil.py pins
# the values the course quotes (the NACA 2412 lift slope of 2*pi at Re = 3e6 and
# the three disagreeing low-Reynolds fits), so raising this cap should mean
# running that file and re-recording ref.NEURALFOIL_NACA2412 -- not editing the
# tolerances until it passes.
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "neuralfoil>=0.3,<0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# The workbench extra is the frozen classroom environment: every third-party
# package at one exact version, resolved once for Windows, macOS, and Linux on
# Python 3.12.  The student launchers install flightlab[workbench], so this list
# is what keeps all students on identical libraries for the semester no matter
# when they install.  (In September 2026 an unpinned Tornado release broke every
# static file in the workbench for students who installed that day.)
#
# The loose inputs live in student_setup/workbench.in and the core dependencies
# above.  Regenerate with `python student_setup/update_pins.py`, about once a
# year before the course starts, then run the tests and the workbench.
workbench = [
    # BEGIN PINS (generated by student_setup/update_pins.py; do not edit by hand)
    "aerosandbox==4.2.10",  # via neuralfoil
    "bokeh==3.9.2",  # via panel, panel-material-ui
    "casadi==3.8.1",  # via aerosandbox
    "certifi==2026.7.22",  # via requests
    "charset-normalizer==3.5.1",  # via requests
    "colorama==0.4.6 ; sys_platform == 'win32'",  # via tqdm
    "contourpy==1.4.0",  # via bokeh, matplotlib
    "cycler==0.12.1",  # via matplotlib
    "dill==0.4.1",  # via aerosandbox
    "fonttools==4.65.0",  # via matplotlib
    "idna==3.19",  # via requests
    "jinja2==3.1.6",  # via bokeh
    "kiwisolver==1.5.1",  # via matplotlib
    "linkify-it-py==2.2.0",  # via panel
    "markdown==3.10.3",  # via panel
    "markdown-it-py==4.2.0",  # via mdit-py-plugins, panel
    "markupsafe==3.0.3",  # via jinja2
    "matplotlib==3.11.2",  # via aerosandbox, seaborn, flightlab (pyproject.toml)
    "mdit-py-plugins==0.6.1",  # via panel
    "mdurl==0.1.2",  # via markdown-it-py
    "narwhals==2.26.0",  # via bokeh, panel
    "neuralfoil==0.3.3",  # via aerosandbox, flightlab (pyproject.toml)
    "nh3==0.3.7",  # via panel
    "numpy==2.5.3",  # via aerosandbox, bokeh, casadi, contourpy, matplotlib, neuralfoil, pandas, scipy, seaborn, flightlab (pyproject.toml)
    "packaging==26.3",  # via bokeh, matplotlib, panel, panel-material-ui
    "pandas==3.0.5",  # via aerosandbox, panel, seaborn, -r student_setup/workbench.in
    "panel==1.9.4",  # via panel-material-ui, -r student_setup/workbench.in
    "panel-material-ui==0.14.2",  # via panel
    "param==2.4.2",  # via panel, pyviz-comms
    "pillow==12.3.0",  # via bokeh, matplotlib
    "pyparsing==3.3.2",  # via matplotlib
    "python-dateutil==2.9.0.post0",  # via matplotlib, pandas
    "pyviz-comms==3.0.6",  # via panel
    "pyyaml==6.0.3",  # via bokeh
    "requests==2.34.2",  # via panel
    "scipy==1.18.1",  # via aerosandbox, flightlab (pyproject.toml)
    "seaborn==0.13.2",  # via aerosandbox
    "six==1.17.0",  # via python-dateutil
    "sortedcontainers==2.4.0",  # via aerosandbox
    "tornado==6.5.10 ; sys_platform != 'emscripten'",  # via bokeh
    "tqdm==4.70.1",  # via aerosandbox, panel
    "typing-extensions==4.16.0",  # via panel
    "tzdata==2026.4 ; sys_platform == 'emscripten' or sys_platform == 'win32'",  # via pandas
    "urllib3==2.8.0",  # via requests
    "xyzservices==2026.9.1",  # via bokeh
    # END PINS
]

[project.scripts]
flightlab = "flightlab.__main__:main"

[tool.setuptools.packages.find]
include = ["flightlab*"]

[tool.setuptools.package-data]
flightlab = ["data/airfoils/*.dat", "data/props/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
flightlab = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
workbench = { features = ["workbench"], solve-group = "default" }

[tool.pixi.tasks]
workbench = "python -m flightlab workbench"
test = "pytest tests"

# Only the interpreter comes from conda-forge.  Everything else is installed
# from PyPI through the extras above, so the pixi workbench environment uses
# exactly the pinned versions students receive (conda builds of panel or pandas
# would otherwise conflict with those pins).
[tool.pixi.dependencies]
python = ">=3.10"
